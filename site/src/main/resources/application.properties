# ==============================================================================
# Configuration SoukLine - Membre 1 (Site Web E-Commerce)
# ==============================================================================

server.port=8080
server.servlet.context-path=

# Journal d'accès géré par TomcatAccessLogConfig -> logs/access.log (format common, unbuffered)
server.tomcat.accesslog.enabled=false
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.rename-on-rotate=false
server.tomcat.accesslog.pattern=common
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.check-exists=true

# ------------------------------------------------------------------------------
# Thymeleaf & Web
# ------------------------------------------------------------------------------
spring.application.name=SoukLine
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ------------------------------------------------------------------------------
# Gestion des sessions HTTP (panier & login en mémoire)
# ------------------------------------------------------------------------------
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=SOUKLINE_SESSION
