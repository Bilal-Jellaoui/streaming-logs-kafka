<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Erreur Interne - 500')}"></head>
<body>
    <div th:replace="~{fragments/layout :: site-header}"></div>
    <main class="main-content">
        <div class="container" style="max-width: 600px; padding: 80px 20px; text-align: center;">
            <div style="font-size: 5rem; font-family: var(--font-serif); color: var(--danger); font-weight: 800; line-height: 1;">500</div>
            <h1 style="font-family: var(--font-serif); font-size: 2rem; margin: 16px 0;">Erreur Interne du Serveur</h1>
            <p style="color: var(--text-muted); margin-bottom: 28px;">Une erreur inattendue est survenue. Les détails ont été enregistrés dans <code>logs/error.log</code>.</p>
            <a th:href="@{/}" class="btn btn-primary">Retour à l'accueil</a>
        </div>
    </main>
    <div th:replace="~{fragments/layout :: site-footer}"></div>
</body>
</html>
