<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Catalogue des Produits')}"></head>
<body>

    <!-- Header -->
    <div th:replace="~{fragments/layout :: site-header}"></div>

    <main class="main-content">
        <div class="container">

            <!-- Breadcrumb / Header -->
            <div style="margin-bottom: 24px;">
                <h1 class="section-title">Catalogue SoukLine</h1>
                <p class="section-subtitle" th:text="${totalCount} + ' pièces artisanales disponibles en stock'"></p>
            </div>

            <!-- Filter & Sort Bar (Liquid Glass & Sized) -->
            <div class="filter-bar">
                <div class="category-pills">
                    <a th:href="@{/produits}" th:classappend="${selectedCategory == null or selectedCategory == ''} ? 'active' : ''" class="pill">
                        Tous les produits
                    </a>
                    <a th:each="cat : ${categories}"
                       th:href="@{/produits(categorie=${cat}, tri=${selectedTri})}"
                       th:classappend="${selectedCategory == cat} ? 'active' : ''"
                       class="pill"
                       th:text="${cat}"></a>
                </div>

                <!-- Sort dropdown -->
                <form method="get" th:action="@{/produits}" style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
                    <input type="hidden" name="categorie" th:value="${selectedCategory}" th:if="${selectedCategory != null}">
                    <label for="tri-select" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); white-space: nowrap;">Trier par :</label>
                    <select id="tri-select" name="tri" onchange="this.form.submit()" class="form-select" style="padding: 7px 14px; font-size: 0.84rem; width: auto; background: rgba(255, 255, 255, 0.85); border-radius: var(--radius-full);">
                        <option value="default" th:selected="${selectedTri == 'default'}">Pertinence</option>
                        <option value="price_asc" th:selected="${selectedTri == 'price_asc'}">Prix : Croissant</option>
                        <option value="price_desc" th:selected="${selectedTri == 'price_desc'}">Prix : Décroissant</option>
                        <option value="rating" th:selected="${selectedTri == 'rating'}">Meilleures Notes</option>
                    </select>
                </form>
            </div>

            <!-- Products Grid -->
            <div class="products-grid">
                <div th:each="p : ${products}" class="product-card">
                    <div class="card-image-box">
                        <span class="product-badge" th:text="${p.badge}">Populaire</span>
                        <img th:src="@{${p.imageUrl}}" th:alt="${p.name}" class="product-card-img" loading="lazy">
                    </div>

                    <div class="product-card-body">
                        <div class="product-category" th:text="${p.category}">Catégorie</div>
                        <h3 class="product-name">
                            <a th:href="@{/produits/{id}(id=${p.id})}" th:text="${p.name}">Nom Produit</a>
                        </h3>

                        <div class="product-rating">
                            <span class="stars">★★★★★</span>
                            <span th:text="${p.rating} + ' (' + ${p.reviewsCount} + ')'">4.8 (35)</span>
                        </div>

                        <p class="product-desc-short" th:text="${p.shortDescription}">Courte description...</p>

                        <div class="product-card-footer">
                            <div class="product-price" th:text="${p.formattedPrice}">220.00 DH</div>
                            <button type="button" class="btn-add-cart btn-quick-add" th:attr="data-product-id=${p.id}">
                                <span>Ajouter</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(products)}" class="cart-empty-card" style="margin-top: 24px;">
                <h3 style="font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; margin-bottom: 8px;">Aucun article dans cette collection</h3>
                <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 24px;">Modifiez vos critères de sélection pour afficher les pièces disponibles.</p>
                <a th:href="@{/produits}" class="btn btn-secondary">Réinitialiser les filtres</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: site-footer}"></div>

</body>
</html>
