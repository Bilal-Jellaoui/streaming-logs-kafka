<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Connexion Client')}"></head>
<body>

    <!-- Header -->
    <div th:replace="~{fragments/layout :: site-header}"></div>

    <main class="main-content">
        <div class="container" style="max-width: 480px; padding: 60px 20px;">

            <div class="glass-panel" style="padding: 40px;">

                <div style="text-align: center; margin-bottom: 28px;">
                    <div class="logo-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 1.3rem;">S</div>
                    <h1 style="font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;">Espace Client SoukLine</h1>
                    <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Connectez-vous pour gérer vos commandes</p>
                </div>

                <!-- Flash alerts -->
                <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
                <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <input type="hidden" name="redirect" th:value="${redirect}">

                    <div class="form-group">
                        <label for="email-input" class="form-label">Adresse Email :</label>
                        <input id="email-input" type="email" name="email" class="form-input" placeholder="ex: client@soukline.ma" value="client@soukline.ma" required>
                    </div>

                    <div class="form-group">
                        <label for="password-input" class="form-label">Mot de Passe :</label>
                        <input id="password-input" type="password" name="password" class="form-input" placeholder="••••••••" value="demo123">
                    </div>

                    <div style="margin-bottom: 24px; margin-top: 24px;">
                        <button type="submit" class="btn btn-primary btn-block" style="padding: 13px;">Se Connecter</button>
                    </div>
                </form>

                <!-- Demo quick account hints -->
                <div style="background: rgba(0, 0, 0, 0.02); padding: 14px 16px; border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-muted); border: 1px solid rgba(0,0,0,0.06);">
                    <strong style="color: var(--text-main);">Comptes pré-configurés :</strong><br>
                    • Client : <code>client@soukline.ma</code><br>
                    • Administrateur : <code>admin@soukline.ma</code>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: site-footer}"></div>

</body>
</html>
