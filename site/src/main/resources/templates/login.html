<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Connexion Client')}"></head>
<body>

    <!-- Header -->
    <div th:replace="~{fragments/layout :: site-header}"></div>

    <main class="main-content">
        <div class="container" style="max-width: 500px; padding: 60px 20px;">

            <div style="background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-light); padding: 40px; box-shadow: var(--shadow-md);">

                <div style="text-align: center; margin-bottom: 28px;">
                    <div style="font-size: 2.8rem; margin-bottom: 8px;">✨</div>
                    <h1 style="font-family: var(--font-serif); font-size: 1.8rem; color: var(--color-indigo);">Espace Client SoukLine</h1>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Connectez-vous pour suivre vos commandes</p>
                </div>

                <!-- Flash alerts -->
                <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
                <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <input type="hidden" name="redirect" th:value="${redirect}">

                    <div class="form-group">
                        <label for="email-input" class="form-label">Adresse Email :</label>
                        <input id="email-input" type="email" name="email" class="form-input" placeholder="ex: amine@soukline.ma" value="client@soukline.ma" required>
                    </div>

                    <div class="form-group">
                        <label for="password-input" class="form-label">Mot de Passe :</label>
                        <input id="password-input" type="password" name="password" class="form-input" placeholder="••••••••" value="demo123">
                    </div>

                    <div style="margin-bottom: 24px;">
                        <button type="submit" class="btn btn-primary btn-block">Se Connecter</button>
                    </div>
                </form>

                <!-- Demo quick account hints -->
                <div style="background: var(--bg-subtle); padding: 14px; border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-muted);">
                    <strong>💡 Comptes démo en mémoire :</strong><br>
                    • Client : <code>client@soukline.ma</code><br>
                    • Administrateur : <code>admin@soukline.ma</code>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: site-footer}"></div>

</body>
</html>
