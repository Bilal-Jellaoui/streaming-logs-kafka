<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head(${product.name})}"></head>
<body>

    <!-- Header -->
    <div th:replace="~{fragments/layout :: site-header}"></div>

    <main class="main-content">
        <div class="container">

            <!-- Breadcrumb -->
            <div style="font-size: 0.84rem; color: var(--text-muted); margin-bottom: 24px;">
                <a th:href="@{/}">Accueil</a> &gt;
                <a th:href="@{/produits}">Produits</a> &gt;
                <a th:href="@{/produits(categorie=${product.category})}" th:text="${product.category}">Catégorie</a> &gt;
                <span th:text="${product.name}" style="color: var(--text-main); font-weight: 600;"></span>
            </div>

            <!-- Product Showcase Layout (Liquid Glass Card) -->
            <div class="product-detail-layout">

                <!-- Real Product Image Box -->
                <div class="product-detail-image-box">
                    <span class="product-badge" style="font-size: 0.82rem; padding: 6px 16px; top: 18px; left: 18px;" th:text="${product.badge}">Best-seller</span>
                    <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" class="product-detail-img">
                </div>

                <!-- Info Box -->
                <div>
                    <span class="product-category" style="font-size: 0.82rem;" th:text="${product.category}">Catégorie</span>
                    <h1 style="font-family: var(--font-display); font-size: 2.1rem; font-weight: 800; color: var(--text-main); margin: 6px 0 14px; line-height: 1.25; letter-spacing: -0.025em;" th:text="${product.name}">Nom du Produit</h1>

                    <div class="product-rating" style="margin-bottom: 20px; font-size: 0.88rem;">
                        <span class="stars">★★★★★</span>
                        <span th:text="${product.rating} + ' / 5.0 (' + ${product.reviewsCount} + ' avis vérifiés)'">4.9 / 5.0 (38 avis)</span>
                    </div>

                    <div style="font-size: 2.2rem; font-weight: 800; color: var(--text-main); font-family: var(--font-display); letter-spacing: -0.02em; margin-bottom: 24px;" th:text="${product.formattedPrice}">
                        1450.00 DH
                    </div>

                    <p style="font-size: 0.96rem; color: var(--text-secondary); line-height: 1.7; margin-bottom: 32px;" th:text="${product.description}">
                        Description détaillée...
                    </p>

                    <!-- Add to Cart Form -->
                    <form th:action="@{/panier/ajouter}" method="post" style="display: flex; gap: 14px; align-items: center; margin-bottom: 32px;">
                        <input type="hidden" name="productId" th:value="${product.id}">

                        <div style="display: flex; align-items: center; border: 1px solid rgba(0,0,0,0.12); border-radius: var(--radius-full); background: rgba(255, 255, 255, 0.9); overflow: hidden; padding-left: 14px;">
                            <label for="quantity-input" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted);">Qté :</label>
                            <input id="quantity-input" type="number" name="quantity" value="1" min="1" max="10" style="width: 55px; padding: 10px; border: none; outline: none; text-align: center; font-weight: 700; background: transparent;">
                        </div>

                        <button type="submit" class="btn btn-primary" style="flex: 1; padding: 13px 24px;">
                            <span>Ajouter au Panier</span>
                        </button>
                    </form>

                    <!-- Minimalist Specifications Grid -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-top: 24px; border-top: 1px solid rgba(0, 0, 0, 0.06); font-size: 0.84rem; color: var(--text-secondary);">
                        <div><strong>Livraison :</strong> 24h à 48h partout au Maroc</div>
                        <div><strong>Paiement :</strong> Passerelle sécurisée CMI & SSL</div>
                        <div><strong>Retours :</strong> 14 jours pour échanger</div>
                        <div><strong>Disponibilité :</strong> <span style="color: #248A3D; font-weight: 600;" th:text="${product.stock} + ' unités en stock'"></span></div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: site-footer}"></div>

</body>
</html>
