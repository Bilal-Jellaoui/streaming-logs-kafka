<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="SoukLine : analyse de logs web en temps réel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#14224a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="84" font-size="15" font-weight="700" letter-spacing="3" fill="#93c5fd">STREAMING · KAFKA · JAVA</text>
    <text x="64" y="160" font-size="72" font-weight="800" fill="#ffffff">Souk<tspan fill="#60a5fa">Line</tspan></text>
    <text x="64" y="204" font-size="26" font-weight="500" fill="#cbd5e1">Analyse de logs web en temps réel, de l'accès HTTP à l'alerte</text>

    <!-- pipeline -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="64"  y="244" width="150" height="46" rx="23" fill="#1d4ed8"/>
      <text x="139" y="273" fill="#fff">Site Spring Boot</text>
      <text x="232" y="273" fill="#64748b" font-size="22">›</text>
      <rect x="250" y="244" width="140" height="46" rx="23" fill="#0f766e"/>
      <text x="320" y="273" fill="#fff">Collecteur</text>
      <text x="408" y="273" fill="#64748b" font-size="22">›</text>
      <rect x="426" y="244" width="150" height="46" rx="23" fill="#0b1220" stroke="#f59e0b" stroke-width="2"/>
      <text x="501" y="273" fill="#fbbf24">Kafka · 3 brokers</text>
      <text x="594" y="273" fill="#64748b" font-size="22">›</text>
      <rect x="612" y="244" width="170" height="46" rx="23" fill="#6d28d9"/>
      <text x="697" y="273" fill="#fff">A · Kafka Streams</text>
      <text x="800" y="273" fill="#64748b" font-size="22">+</text>
      <rect x="818" y="244" width="186" height="46" rx="23" fill="#be185d"/>
      <text x="911" y="273" fill="#fff">B · Concurrence Java</text>
      <text x="1022" y="273" fill="#64748b" font-size="22">›</text>
      <rect x="1040" y="244" width="176" height="46" rx="23" fill="#dc2626"/>
      <text x="1128" y="273" fill="#fff">Tableau + Alerte</text>
    </g>

    <!-- chiffres -->
    <g text-anchor="end">
      <text x="1216" y="100" font-size="15" font-weight="700" fill="#93c5fd" letter-spacing="2">MASTER BDAIA · UIT KÉNITRA</text>
      <text x="1216" y="150" font-size="44" font-weight="800" fill="#ffffff">47+ <tspan font-size="16" font-weight="600" fill="#94a3b8">tests</tspan></text>
      <text x="1216" y="190" font-size="44" font-weight="800" fill="#ffffff">2 <tspan font-size="16" font-weight="600" fill="#94a3b8">moteurs, mêmes chiffres</tspan></text>
    </g>
  </g>
</svg>
